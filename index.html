<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Grid</title>
<style>
/* Layout: one-screen tool. Toolbar on top, photo canvas fills the middle, readout bar at the bottom. */
:root {
  --bg: #eef1f3; --panel: #ffffff; --fg: #17212b; --muted: #5b6875;
  --accent: #1f5fa8; --accent-fg: #ffffff; --line: #d3d9df;
  --font: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1419; --panel: #1a2129; --fg: #e4e9ee; --muted: #93a0ad; --accent: #5c9be0; --accent-fg: #0f1419; --line: #2b3540; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1419; --panel: #1a2129; --fg: #e4e9ee; --muted: #93a0ad; --accent: #5c9be0; --accent-fg: #0f1419; --line: #2b3540; color-scheme: dark }
html, body { height: 100%; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); display: flex; flex-direction: column; overflow: hidden; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); align-items: center; }
.bar.bottom { border-bottom: 0; border-top: 1px solid var(--line); min-height: 52px; }
button, label.btn { font: 600 14px/1 var(--font); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
button:focus-visible, label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
#file { position: absolute; width: 1px; height: 1px; opacity: 0; }
#stage { flex: 1; position: relative; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#cell { font: 700 22px/1 var(--mono); font-variant-numeric: tabular-nums; }
#hint { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700&family=IBM+Plex+Sans:wght@400;600&display=swap">
</head>
<body>

<div class="bar">
  <label class="btn primary" for="file">Take photo<input id="file" type="file" accept="image/*" capture="environment"></label>
  <button id="rot" type="button">Rotate origin</button>
  <button id="lock" type="button" aria-pressed="false">Lock corners</button>
</div>
<div id="stage"><canvas id="cv"></canvas></div>
<div class="bar bottom">
  <span id="cell">–</span>
  <span id="hint">Sample image. Take a photo, then drag the 4 corner dots onto the arena corners.</span>
</div>

<script>
const N = 20;                       // 20 x 20 cells, 10 cm each
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const cellEl = document.getElementById('cell'), hintEl = document.getElementById('hint');
let img = null;                     // source image (canvas or Image)
let corners = [];                   // image px: [origin(0,0), +x end, far corner, +y end]
let locked = false, sel = null;     // sel = [x, y] selected cell
let view = { s: 1, ox: 0, oy: 0, W: 0, H: 0, dpr: 1 };
let drag = null;                    // { i, startPt, startCorner }

// ---- homography: unit square -> quad (Heckbert) ----
function sq2quad(q) {
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]] = q;
  const dx1=x1-x2, dx2=x3-x2, dx3=x0-x1+x2-x3, dy1=y1-y2, dy2=y3-y2, dy3=y0-y1+y2-y3;
  let g=0, h=0;
  if (Math.abs(dx3) > 1e-9 || Math.abs(dy3) > 1e-9) {
    const den = dx1*dy2 - dx2*dy1;
    g = (dx3*dy2 - dx2*dy3) / den; h = (dx1*dy3 - dx3*dy1) / den;
  }
  return [x1-x0+g*x1, x3-x0+h*x3, x0, y1-y0+g*y1, y3-y0+h*y3, y0, g, h, 1];
}
function inv3(m) {
  const [a,b,c,d,e,f,g,h,i] = m;
  const A=e*i-f*h, B=-(d*i-f*g), C=d*h-e*g, det=a*A+b*B+c*C;
  return [A,-(b*i-c*h),b*f-c*e, B,a*i-c*g,-(a*f-c*d), C,-(a*h-b*g),a*e-b*d].map(v=>v/det);
}
function apply(m, u, v) {
  const w = m[6]*u + m[7]*v + m[8];
  return [(m[0]*u + m[1]*v + m[2]) / w, (m[3]*u + m[4]*v + m[5]) / w];
}
// grid coords (0..20) -> image px
const G = (H, gx, gy) => apply(H, gx / N, gy / N);

// ---- view transforms ----
const toScreen = ([x, y]) => [x * view.s + view.ox, y * view.s + view.oy];
const toImage = ([x, y]) => [(x - view.ox) / view.s, (y - view.oy) / view.s];

function resize() {
  const r = stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  view.W = r.width; view.H = r.height; view.dpr = dpr;
  if (img) {
    const pad = 28;  // room for axis labels
    view.s = Math.min((r.width - 2*pad) / img.width, (r.height - 2*pad) / img.height);
    view.ox = (r.width - img.width * view.s) / 2; view.oy = (r.height - img.height * view.s) / 2;
  }
  draw();
}

function draw() {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, view.W, view.H);
  if (!img) return;
  ctx.drawImage(img, view.ox, view.oy, img.width * view.s, img.height * view.s);
  const H = sq2quad(corners);
  const P = (gx, gy) => toScreen(G(H, gx, gy));

  // selected cell
  if (sel) {
    const [x, y] = sel;
    ctx.beginPath();
    [[x,y],[x+1,y],[x+1,y+1],[x,y+1]].forEach(([a,b],k) => { const p = P(a,b); k ? ctx.lineTo(...p) : ctx.moveTo(...p); });
    ctx.closePath(); ctx.fillStyle = 'rgba(255,200,0,0.45)'; ctx.fill();
  }

  // grid lines: light halo then dark line so they read on light and dark floors
  for (const [w, col] of [[3, 'rgba(255,255,255,0.55)'], [1.2, 'rgba(0,90,200,0.95)']]) {
    ctx.lineWidth = w; ctx.strokeStyle = col; ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      ctx.moveTo(...P(i, 0)); ctx.lineTo(...P(i, N));
      ctx.moveTo(...P(0, i)); ctx.lineTo(...P(N, i));
    }
    ctx.stroke();
  }
  // every 5th line heavier
  ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(220,30,30,0.9)'; ctx.beginPath();
  for (const i of [0, 5, 10, 15, 20]) {
    ctx.moveTo(...P(i, 0)); ctx.lineTo(...P(i, N));
    ctx.moveTo(...P(0, i)); ctx.lineTo(...P(N, i));
  }
  ctx.stroke();

  // axis labels 0..19 at cell centres, outside the bottom (y=0) and left (x=0) edges
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const label = (t, p, size) => {
    ctx.font = `700 ${size}px "IBM Plex Mono", monospace`;
    ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.strokeText(t, ...p);
    ctx.fillStyle = '#111'; ctx.fillText(t, ...p);
  };
  // font follows the on-screen cell size; when cells are small, label every 2nd or 5th cell instead
  const len = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const axis = (cellLen, at) => {
    const Ls = [...Array(N).keys()].map(cellLen), step = Math.min(...Ls) >= 13 ? 1 : Math.min(...Ls) >= 7 ? 2 : 5;
    for (let i = 0; i < N; i += step) label(String(i), at(i), Math.max(7, Math.min(11, Ls[i] * (step === 1 ? 0.65 : 1.1))));
  };
  axis(i => len(P(i, 0), P(i + 1, 0)), i => P(i + 0.5, -0.6));
  axis(i => len(P(0, i), P(0, i + 1)), i => P(-0.7, i + 0.5));

  // corner handles
  const names = ['', 'X', '', 'Y'];
  corners.forEach((c, k) => {
    const p = toScreen(c);
    ctx.beginPath(); ctx.arc(...p, 7, 0, 7);
    ctx.fillStyle = k === 0 ? 'rgba(220,30,30,0.35)' : 'rgba(0,90,200,0.3)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = locked ? '#888' : (k === 0 ? '#dc1e1e' : '#005ac8'); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p[0]-4, p[1]); ctx.lineTo(p[0]+4, p[1]); ctx.moveTo(p[0], p[1]-4); ctx.lineTo(p[0], p[1]+4);
    ctx.lineWidth = 1; ctx.stroke();
    if (names[k]) label(names[k], [p[0], p[1] - 16], 11);
  });

  if (drag) drawLoupe(corners[drag.i]);
}

// zoomed view of the source image around the dragged corner, in the top corner away from it
function drawLoupe(c) {
  const R = 70, Z = 4, sp = toScreen(c);
  const cx = sp[0] < view.W / 2 ? view.W - R - 10 : R + 10, cy = R + 10;
  const srcR = R / (view.s * Z);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.closePath();
  ctx.fillStyle = '#000'; ctx.fill(); ctx.clip();
  ctx.drawImage(img, c[0] - srcR, c[1] - srcR, srcR * 2, srcR * 2, cx - R, cy - R, R * 2, R * 2);
  ctx.strokeStyle = '#ff2a2a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
}

// ---- input ----
const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
let down = null;
cv.addEventListener('pointerdown', e => {
  if (!img) return;
  const p = pt(e); down = p;
  if (!locked) {
    let best = -1, bd = 40;
    corners.forEach((c, k) => { const s = toScreen(c), d = Math.hypot(s[0]-p[0], s[1]-p[1]); if (d < bd) { bd = d; best = k; } });
    if (best >= 0) { drag = { i: best, start: p, c0: corners[best].slice() }; cv.setPointerCapture(e.pointerId); draw(); }
  }
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pt(e);
  // relative drag at half speed: the finger never covers the point, and fine moves are easier
  const k = 0.5 / view.s;
  corners[drag.i] = [drag.c0[0] + (p[0] - drag.start[0]) * k, drag.c0[1] + (p[1] - drag.start[1]) * k];
  draw();
});
cv.addEventListener('pointerup', e => {
  const p = pt(e);
  if (drag) { drag = null; draw(); return; }
  if (!down || Math.hypot(p[0]-down[0], p[1]-down[1]) > 10) return;
  const Hi = inv3(sq2quad(corners));
  const [u, v] = apply(Hi, ...toImage(p));
  const gx = Math.floor(u * N), gy = Math.floor(v * N);
  if (gx >= 0 && gx < N && gy >= 0 && gy < N) {
    sel = [gx, gy];
    cellEl.textContent = `(${gx}, ${gy})`;
    hintEl.textContent = `x ${(u*200).toFixed(0)} cm, y ${(v*200).toFixed(0)} cm. Tap where the box base meets the floor, not its top.`;
  } else { sel = null; cellEl.textContent = '–'; }
  draw();
});
cv.addEventListener('pointercancel', () => { drag = null; draw(); });

document.getElementById('rot').onclick = () => {
  corners = [corners[1], corners[2], corners[3], corners[0]];
  sel = null; cellEl.textContent = '–'; draw();
};
document.getElementById('lock').onclick = e => {
  locked = !locked; e.currentTarget.setAttribute('aria-pressed', String(locked)); draw();
};
document.getElementById('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => {
    img = im; const w = im.width, h = im.height;
    corners = [[w*.15, h*.85], [w*.85, h*.85], [w*.75, h*.35], [w*.25, h*.35]];
    sel = null; locked = false; document.getElementById('lock').setAttribute('aria-pressed', 'false');
    cellEl.textContent = '–';
    hintEl.textContent = 'Drag each dot onto its arena corner (red = origin 0,0). A zoom circle appears while dragging. Then lock and tap obstacles.';
    resize();
  };
  im.src = URL.createObjectURL(f);
  e.target.value = '';
};

// ---- sample scene so the first view shows the grid ----
function sample() {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 800;
  const g = c.getContext('2d');
  g.fillStyle = '#d9d8d2'; g.fillRect(0, 0, 1200, 800);
  const q = [[90, 740], [1110, 740], [900, 150], [300, 150]];
  g.strokeStyle = '#555'; g.lineWidth = 4; g.beginPath(); q.forEach((p,k)=>k?g.lineTo(...p):g.moveTo(...p)); g.closePath(); g.stroke();
  const H = sq2quad(q);
  for (const [x, y] of [[2, 1], [9, 7], [15, 12], [4, 15], [17, 4], [11, 17]]) {
    const b = G(H, x + 0.5, y + 0.5), s = Math.hypot(...[0,1].map(k => G(H, x+1, y)[k] - G(H, x, y)[k]));
    g.fillStyle = '#16181b'; g.fillRect(b[0] - s/2, b[1] - s*1.1, s, s*1.1);
  }
  img = c; corners = q.map(p => p.slice());
}
sample();
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
